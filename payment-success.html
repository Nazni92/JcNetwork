<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful | JC Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{ box-sizing:border-box; }

body{
  background:#000;
  color:#fff;
  font-family:Segoe UI,Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.box{
  background:#111;
  border:1px solid #d4af37;
  padding:32px;
  border-radius:18px;
  text-align:center;
  max-width:420px;
  width:100%;
  box-shadow:0 0 35px rgba(212,175,55,0.25);
}

h2{
  color:#d4af37;
  margin-bottom:12px;
  font-size:22px;
}

p{
  color:#ccc;
  font-size:14px;
  line-height:1.6;
  margin:6px 0;
}

.details{
  margin-top:15px;
  background:#000;
  border:1px dashed #333;
  border-radius:12px;
  padding:12px;
  font-size:13px;
  color:#bbb;
  text-align:left;
}

.details div{
  margin:6px 0;
}

.btn{
  display:inline-block;
  margin-top:22px;
  padding:14px 30px;
  background:#25D366;
  color:#fff;
  border-radius:30px;
  font-weight:bold;
  text-decoration:none;
  font-size:15px;
  transition:transform .2s, box-shadow .2s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 22px rgba(37,211,102,.7);
}

.note{
  margin-top:14px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="box">
  <h2>✅ Payment Successful</h2>
  <p>Thank you for your payment.</p>
  <p>Please confirm your payment with admin for activation.</p>

  <div class="details">
    <div><strong>App:</strong> <span id="appName">-</span></div>
    <div><strong>Package:</strong> <span id="pkgName">-</span></div>
    <div><strong>ToyyibPay Ref:</strong> <span id="billRef">-</span></div>
  </div>

  <a id="waLink" class="btn" target="_blank" rel="noopener">
    📩 Send Payment Details
  </a>

  <div class="note">
    Activation time: 5–30 minutes during operation hours
  </div>
</div>

<script>
  // CHANGE this to your WhatsApp number (international format, no "+")
  const ADMIN_WA = "60179290815";

  // Read saved order info from index.html
  const app = localStorage.getItem("paidApp") || "Not specified";
  const pkg = localStorage.getItem("paidPackage") || "Not specified";

  // ToyyibPay may return different param names depending on your setup
  const params = new URLSearchParams(window.location.search);
  const billcode =
    params.get("billcode") ||
    params.get("refno") ||
    params.get("transaction_id") ||
    params.get("order_id") ||
    "Not provided";

  // Show on page
  document.getElementById("appName").innerText = app;
  document.getElementById("pkgName").innerText = pkg;
  document.getElementById("billRef").innerText = billcode;

  // Build WhatsApp message safely
  const msg = `Hi Admin,

✅ Payment Successful
📺 App: ${app}
📦 Package: ${pkg}
🧾 ToyyibPay Ref: ${billcode}

Please activate my service. Thank you.`;

  // WhatsApp link (encoded)
  document.getElementById("waLink").href =
    `https://wa.me/${ADMIN_WA}?text=` + encodeURIComponent(msg);

  // Optional: clear saved values so next visit is clean
  setTimeout(() => {
    localStorage.removeItem("paidApp");
    localStorage.removeItem("paidPackage");
  }, 5000);
</script>

</body>
</html>
