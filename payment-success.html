<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#000;
  color:#fff;
  font-family:Segoe UI,Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#111;
  border:1px solid #d4af37;
  padding:30px;
  border-radius:15px;
  text-align:center;
  max-width:360px;
}
h2{color:#d4af37;}
.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:#25D366;
  color:#fff;
  border-radius:30px;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="box">
  <h2>✅ Payment Successful</h2>
  <p>Thank you for your payment.</p>
  <p>Click below to confirm with admin.</p>
  <a id="waLink" class="btn">📩 Send Payment Details</a>
</div>

<script>
const app = localStorage.getItem("paidApp") || "Unknown App";
const pkg = localStorage.getItem("paidPackage") || "Unknown Package";

// ToyyibPay will add ?billcode=XXXX
const params = new URLSearchParams(window.location.search);
const billcode = params.get("billcode") || "N/A";

const msg =
`Hi Admin,%0A%0A`+
`✅ Payment Successful%0A`+
`📺 App: ${app}%0A`+
`📦 Package: ${pkg}%0A`+
`🧾 ToyyibPay Ref: ${billcode}%0A%0A`+
`Please activate my service. Thank you.`;

document.getElementById("waLink").href =
`https://wa.me/60179290815?text=${msg}`;
</script>

</body>
</html>
